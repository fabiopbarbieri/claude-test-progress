name: Mod integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-mod:
    name: Claude 2.1.289 native mod tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISABLE_UPDATES: '1'
      DISABLE_AUTOUPDATER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # Official npm distribution; isolated prefix, no project/global dependency.
      # https://code.claude.com/docs/en/setup#install-with-npm
      - name: Install pinned Claude CLI in runner temporary directory
        run: npm install --prefix "$RUNNER_TEMP/claude-cli" --no-audit --no-fund --save-exact @anthropic-ai/claude-code@2.1.289
      # Native test kit needs no account, API key, model, or network call.
      # https://code.claude.com/docs/en/plugins/mods/test
      - name: Validate manifest and native mod behavior
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-test-config"
          cli="$RUNNER_TEMP/claude-cli/node_modules/.bin/claude"
          test "$("$cli" --version)" = '2.1.289 (Claude Code)'
          "$cli" plugin validate .
          "$cli" plugin test .
