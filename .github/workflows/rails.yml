name: Rails adapter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rails:
    name: Rails ${{ matrix.rails }} (Ruby ${{ matrix.ruby }})${{ matrix.suffix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.3'
            rails: '7.2'
            gemfile: tests/dependencies/rails72/Gemfile
          - ruby: '3.4'
            rails: '8.0'
            gemfile: tests/dependencies/rails80/Gemfile
          - ruby: '3.4'
            rails: '8.1'
            gemfile: tests/dependencies/rails81/Gemfile
          - ruby: '3.4'
            rails: '8.1'
            gemfile: tests/dependencies/rails81-minitest6/Gemfile
            suffix: ' Minitest 6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: '2.6.9'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked fixture dependencies
        env:
          BUNDLE_GEMFILE: ${{ matrix.gemfile }}
          BUNDLE_PATH: ${{ runner.temp }}/fixture-bundle
          BUNDLE_FROZEN: 'true'
          RAILS_SERIES: ${{ matrix.rails }}
        run: |
          bundle install --jobs 4 --retry 3
          # Fixtures create their own Gemfiles: expose installed gems, not this bundle.
          bundle exec ruby -e 'puts "GEM_HOME=#{Gem.dir}"; puts "GEM_PATH=#{Gem.path.join(File::PATH_SEPARATOR)}"' >> "$GITHUB_ENV"
          bundle exec ruby -e '
            rails = Gem.loaded_specs.fetch("rails").version.to_s
            abort "Rails matrix series mismatch" unless rails.start_with?(ENV.fetch("RAILS_SERIES") + ".")
            puts "RAILS_VERSION=#{rails}"
            puts "MINITEST_VERSION=#{Gem.loaded_specs.fetch("minitest").version}"
          ' >> "$GITHUB_ENV"
      - run: python3 scripts/check-rails.py
