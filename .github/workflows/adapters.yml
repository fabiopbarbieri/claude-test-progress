name: Java, Angular and Playwright adapters

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: adapters-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  junit:
    name: JUnit (Java ${{ matrix.java }}, collector Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            node: '14.0.0'
          - java: '21'
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Real JUnit and Surefire integration
        run: python3 scripts/check-junit.py

  angular:
    name: Angular ${{ matrix.angular }} (app Node ${{ matrix.frontend }}, collector Node ${{ matrix.collector }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - angular: '9'
            frontend: '12.22.12'
            collector: '14.0.0'
          - angular: '18'
            frontend: '22'
            collector: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.frontend }}
      - name: Record app Node and headless Chrome
        run: |
          echo "FRONTEND_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.collector }}
      - name: Real Angular CLI, Karma and browser integration
        env:
          ANGULAR_VERSION: ${{ matrix.angular }}
        run: python3 scripts/check-karma.py --angular "$ANGULAR_VERSION" --frontend-node "$FRONTEND_NODE"

  playwright:
    name: Playwright ${{ matrix.playwright }} (app Node ${{ matrix.frontend }}, collector Node ${{ matrix.collector }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - playwright: minimum
            frontend: '18'
            collector: '14.0.0'
          - playwright: latest
            frontend: '24'
            collector: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.frontend }}
      - name: Record app Node
        run: echo "FRONTEND_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.collector }}
      - name: Real Playwright Test and Chromium integration
        env:
          PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
          # Playwright before 1.52 still points at the retired azureedge hosts.
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.playwright.dev
        run: python3 scripts/check-playwright.py --playwright "$PLAYWRIGHT_VERSION" --frontend-node "$FRONTEND_NODE" --install-browser
