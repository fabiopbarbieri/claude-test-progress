name: Ruby adapter

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ruby-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rspec:
    name: RSpec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        ruby: ['3.1', '3.4', '4.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install verification dependencies in temporary directory
        run: |
          echo "GEM_HOME=$RUNNER_TEMP/ruby-gems" >> "$GITHUB_ENV"
          echo "GEM_PATH=$RUNNER_TEMP/ruby-gems" >> "$GITHUB_ENV"
          gem install rspec -v 3.13.2 --no-document --install-dir "$RUNNER_TEMP/ruby-gems"
          gem install rspec-core -v 3.13.6 --no-document --install-dir "$RUNNER_TEMP/ruby-gems"
          gem install rspec-retry -v 0.6.2 --no-document --install-dir "$RUNNER_TEMP/ruby-gems"
      - name: Syntax and integration checks
        run: |
          ruby -c adapters/ruby/run.rb
          ruby -c adapters/ruby/rspec_progress.rb
          ruby -c adapters/ruby/rspec_listener.rb
          python3 scripts/check-ruby.py
