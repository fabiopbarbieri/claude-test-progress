name: Ruby adapter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ruby-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rspec:
    name: RSpec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        ruby: ['3.1', '3.4', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: '2.6.9'
      - name: Install locked fixture dependencies
        env:
          BUNDLE_GEMFILE: tests/dependencies/rspec/Gemfile
          BUNDLE_PATH: ${{ runner.temp }}/fixture-bundle
          BUNDLE_FROZEN: 'true'
        run: |
          bundle install --jobs 4 --retry 3
          # Fixtures create their own Gemfiles: expose installed gems, not this bundle.
          bundle exec ruby -e 'puts "GEM_HOME=#{Gem.dir}"; puts "GEM_PATH=#{Gem.path.join(File::PATH_SEPARATOR)}"' >> "$GITHUB_ENV"
      - name: Syntax and integration checks
        run: |
          ruby -c adapters/ruby/run.rb
          ruby -c adapters/ruby/rspec_progress.rb
          ruby -c adapters/ruby/rspec_listener.rb
          python3 scripts/check-ruby.py
